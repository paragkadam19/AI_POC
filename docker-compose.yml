version: "3.9"

services:
  data-resonance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-resonance-poc
    ports:
      - "5000:5000"
    volumes:
      # Persist storage so data survives container restarts
      - ./storage:/app/storage
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3